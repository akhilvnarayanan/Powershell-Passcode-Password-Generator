<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .password-display {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }

        .copy-btn {
            background: #28a745;
        }

        .copy-btn:hover {
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .copy-btn.copied {
            background: #6c757d;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 8px;
            font-size: 14px;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="form-group">
            <label for="length">Password Length</label>
            <input type="number" id="length" value="12" min="4" max="128">
        </div>
        
        <div class="form-group">
            <label for="nonAlpha">Number of Special Characters</label>
            <input type="number" id="nonAlpha" value="2" min="0" max="50">
        </div>
        
        <button id="generateBtn">Generate Password</button>
        
        <div class="result-container" id="resultContainer">
            <div class="password-display" id="passwordDisplay"></div>
            <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
        </div>
        
        <div class="info">
            This tool generates secure random passwords. Click "Generate Password" and then copy it to your clipboard.
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const passwordDisplay = document.getElementById('passwordDisplay');
        const resultContainer = document.getElementById('resultContainer');
        const lengthInput = document.getElementById('length');
        const nonAlphaInput = document.getElementById('nonAlpha');

        generateBtn.addEventListener('click', async () => {
            const length = parseInt(lengthInput.value) || 12;
            const nonAlpha = parseInt(nonAlphaInput.value) || 0;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ length, nonAlpha }),
                });

                const data = await response.json();
                passwordDisplay.textContent = data.password;
                resultContainer.classList.add('show');
                copyBtn.textContent = 'Copy to Clipboard';
                copyBtn.classList.remove('copied');
            } catch (error) {
                console.error('Error generating password:', error);
            }
        });

        copyBtn.addEventListener('click', async () => {
            const password = passwordDisplay.textContent;
            try {
                await navigator.clipboard.writeText(password);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy to Clipboard';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (error) {
                const textArea = document.createElement('textarea');
                textArea.value = password;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy to Clipboard';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }
        });
    </script>
</body>
</html>
